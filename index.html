<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>InvestBattle v1.0</title>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-database-compat.js"></script>
    <style>
        /* ========== СТИЛИ ========== */
        *{margin:0;padding:0;box-sizing:border-box;user-select:none;}
        body{background:#080812;font-family:system-ui;color:#d8d8e0;display:flex;justify-content:center;min-height:100vh;}
        .app{width:100%;max-width:500px;background:#0a0a14;min-height:100vh;padding:14px 14px 80px;}
        
        /* Шапка */
        .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
        .logo{font-size:20px;font-weight:800;cursor:pointer;}
        .logo span{color:#f0a030;}
        .timer{font-size:30px;font-weight:900;color:#f0a030;}
        .timer.urgent{color:#f03050;animation:shake 0.35s infinite;}
        @keyframes shake{50%{transform:translateX(4px);}}
        .badge{padding:5px 12px;border-radius:16px;font-size:11px;background:rgba(240,160,48,0.15);color:#f0a030;}
        
        /* Карточки игроков */
        .vs-row{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
        .player-card{flex:1;background:#0d0d1a;border:1px solid #2a2a3a;border-radius:14px;padding:10px;text-align:center;cursor:pointer;}
        .player-card.you{border-color:#00e070;}
        .player-card .avatar{width:36px;height:36px;border-radius:50%;margin:0 auto 6px;background:#1a1a2e;display:flex;align-items:center;justify-content:center;overflow:hidden;}
        .player-card .avatar img{width:100%;height:100%;object-fit:cover;}
        .player-card .name{font-size:11px;font-weight:700;}
        .player-card .cash{font-size:14px;font-weight:900;color:#00e070;}
        
        /* Таблица портфеля */
        .portfolio-scroll{max-height:200px;overflow-y:auto;margin-bottom:10px;}
        table.portfolio{width:100%;border-collapse:collapse;font-size:10px;}
        table.portfolio th{color:#888;padding:6px 4px;text-align:left;border-bottom:1px solid #2a2a3a;}
        table.portfolio td{padding:6px 4px;border-bottom:1px solid rgba(255,255,255,0.03);}
        .sym{font-weight:700;color:#fff;}
        .up{color:#00e070;}.down{color:#f03050;}
        .qty-input{width:40px;padding:6px;background:#000;border:1px solid #2a2a3a;color:#fff;border-radius:6px;text-align:center;}
        .btn-sm{padding:6px 10px;border:1px solid #2a2a3a;background:#0d0d1a;color:#fff;border-radius:10px;cursor:pointer;font-size:10px;}
        .btn-sm.sell{border-color:#f03050;color:#f03050;}
        
        /* Кейс (акция) */
        .case-box{background:#0d0d1a;border:2px solid #f0a030;border-radius:14px;padding:10px;margin-bottom:8px;}
        .case-box .case-title{font-weight:700;font-size:13px;color:#f0a030;}
        .case-box .case-desc{font-size:10px;color:#888;}
        .case-box .case-price{font-weight:700;font-size:13px;color:#fff;margin-top:6px;}
        
        /* Кнопки действий */
        .action-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
        .qty-control{display:flex;gap:4px;}
        .qty-control button{width:36px;height:36px;background:#0d0d1a;border:1px solid #2a2a3a;color:#fff;border-radius:8px;font-size:18px;cursor:pointer;}
        .qty-control input{width:50px;padding:8px;background:#000;border:1px solid #2a2a3a;color:#fff;border-radius:8px;text-align:center;font-weight:700;}
        .quick-qty{display:flex;gap:4px;margin-bottom:8px;}
        .quick-qty button{padding:4px 8px;background:#0d0d1a;border:1px solid #2a2a3a;border-radius:8px;cursor:pointer;font-size:9px;}
        .btn{padding:12px 16px;border:1.5px solid #2a2a3a;border-radius:12px;cursor:pointer;font-weight:700;background:#0d0d1a;color:#fff;text-align:center;width:100%;margin-bottom:4px;}
        .btn.gold{background:#f0a030;color:#000;border:none;}
        .btn.green{background:#00e070;color:#000;border:none;}
        .btn.red{background:#f03050;color:#fff;border:none;}
        
        /* Прогноз (чит) */
        .ghost-predict-box{background:rgba(240,160,48,0.1);border:1px solid #f0a030;border-radius:8px;padding:8px;margin-top:8px;font-size:10px;text-align:center;}
        
        /* Модальные окна */
        .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:250;align-items:center;justify-content:center;}
        .modal.show{display:flex;}
        .modal-content{background:#0a0a14;border:2px solid #f0a030;border-radius:18px;padding:20px;width:92%;max-width:420px;max-height:90vh;overflow-y:auto;position:relative;}
        .modal-content h3{color:#f0a030;margin-bottom:12px;text-align:center;}
        .modal-close{position:absolute;top:10px;right:14px;font-size:22px;color:#f0a030;cursor:pointer;background:transparent;border:none;}
        .input{width:100%;padding:14px;background:#000;border:1px solid #2a2a3a;color:#fff;border-radius:12px;text-align:center;margin-bottom:8px;}
        .chip-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:6px 0;}
        .chip{padding:10px 16px;border:1.5px solid #2a2a3a;background:#0d0d1a;border-radius:18px;cursor:pointer;font-size:12px;}
        .chip.selected{border-color:#f0a030;background:rgba(240,160,48,0.2);}
        .profile-avatar{width:50px;height:50px;border-radius:50%;background:#1a1a2e;border:2px solid #f0a030;margin:0 auto;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;}
        .bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:500px;background:#0a0a14;border-top:1px solid #2a2a3a;display:flex;padding:10px;z-index:50;}
        .bottom-nav .nav-btn{flex:1;text-align:center;color:#888;font-size:12px;cursor:pointer;padding:10px;}
        .bottom-nav .nav-btn.active{color:#f0a030;background:rgba(240,160,48,0.15);}
        .admin-btn{position:fixed;bottom:70px;left:20px;width:46px;height:46px;background:#0d0d1a;border:2px solid #00e070;border-radius:12px;color:#00e070;font-size:20px;cursor:pointer;z-index:50;display:none;align-items:center;justify-content:center;}
        .loading-screen{text-align:center;padding:40px;color:#f0a030;}
        .sell-all-btn{width:100%;padding:10px;background:rgba(240,48,80,0.1);border:1px solid #f03050;color:#f03050;border-radius:10px;cursor:pointer;margin-bottom:6px;}
        .ready-counter{text-align:center;font-size:14px;font-weight:900;color:#f0a030;margin:4px 0;}
        .copied-toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#00e070;color:#000;padding:10px 20px;border-radius:20px;z-index:999;opacity:0;transition:opacity 0.3s;}
        .copied-toast.show{opacity:1;}
    </style>
</head>
<body>
<div class="app" id="app">
    <!-- ========== ЭКРАН ЗАГРУЗКИ ========== -->
    <div class="loading-screen" id="loadingScreen">Загрузка...</div>
    
    <!-- ========== ГЛАВНОЕ МЕНЮ ========== -->
    <div id="menuScreen" style="display:none;">
        <div class="header">
            <div class="logo" id="logoClick"><span>InvestBattle</span></div>
            <div class="badge">v1.0</div>
        </div>
        <div class="profile-section" style="display:flex;align-items:center;gap:12px;margin-bottom:14px;padding:12px;background:#0d0d1a;border-radius:14px;">
            <div class="profile-avatar" id="profileAvatar">?</div>
            <div style="flex:1;">
                <div style="font-weight:700;" id="profileName"></div>
                <div style="font-size:11px;color:#f0a030;"><span id="profileStars">0</span> | <span id="profileDollars">0</span></div>
            </div>
            <button class="profile-btn" id="settingsBtn" style="padding:12px 18px;background:#0d0d1a;border:2px solid #f0a030;border-radius:14px;color:#f0a030;cursor:pointer;">⚙️</button>
        </div>
        <button class="btn gold" id="playMenuBtn" style="font-size:18px;padding:20px;">🎮 ИГРАТЬ</button>
        <div id="playMenu" style="display:none;margin-top:10px;">
            <button class="btn gold" id="soloBtn">🤖 Тренировка с ботом</button>
            <button class="btn" id="backMenuBtn">↩ Назад</button>
        </div>
    </div>
    
    <!-- ========== ИГРОВОЙ ЭКРАН ========== -->
    <div id="gameScreen" style="display:none;">
        <div class="game-top">
            <div class="header">
                <div class="logo"><span>InvestBattle</span></div>
                <div class="timer" id="timer">30</div>
                <div class="badge" id="roundBadge">1/10</div>
            </div>
            <div class="vs-row" id="playersRow"></div>
            <button class="sell-all-btn" id="sellAllBtn">💰 ПРОДАТЬ ВСЁ</button>
            <div class="portfolio-scroll">
                <table class="portfolio">
                    <thead><tr><th>Актив</th><th>Кол</th><th>Цена</th><th>Стоим</th><th>±</th><th></th></tr></thead>
                    <tbody id="portfolioBody"></tbody>
                </table>
            </div>
            <div class="case-box">
                <div class="case-title" id="caseTitle"></div>
                <div class="case-desc" id="caseDesc"></div>
                <div class="case-price" id="casePrice"></div>
            </div>
            <!-- Блок прогноза (для чита "Исход игры") -->
            <div class="ghost-predict-box" id="ghostPredictBox" style="display:none;"></div>
        </div>
        <div class="game-bottom">
            <div class="action-row">
                <div class="qty-control">
                    <button id="qtyMinus">−</button>
                    <input type="text" id="buyQty" value="1">
                    <button id="qtyPlus">+</button>
                </div>
                <button class="btn green btn-inline" id="buyBtn">КУПИТЬ</button>
                <button class="btn red btn-inline" id="waitBtn">NO</button>
            </div>
            <div class="quick-qty">
                <button onclick="window.setBuyQty(1)">1</button>
                <button onclick="window.setBuyQty(5)">5</button>
                <button onclick="window.setBuyQty(10)">10</button>
                <button onclick="window.setBuyQty('max')">MAX</button>
            </div>
            <div class="ready-counter" id="readyStatus">NO: 0/0</div>
        </div>
    </div>
    
    <!-- ========== МОДАЛЬНЫЕ ОКНА ========== -->
    <div class="modal" id="profileModal">
        <div class="modal-content">
            <button class="modal-close" id="profileCloseBtn">✕</button>
            <h3>👤 Профиль</h3>
            <div class="profile-avatar" id="editAvatarBig" style="margin:0 auto 10px;width:64px;height:64px;">?</div>
            <input class="input" id="editName" placeholder="Никнейм" maxlength="20">
            <div class="section-title" style="font-size:10px;color:#888;">Аватар</div>
            <div class="chip-row" id="avatarChips">
                <div class="chip" data-avatar="icons/avatar1.png"><img src="icons/avatar1.png" style="width:32px;height:32px;border-radius:50%;"></div>
                <div class="chip" data-avatar="icons/avatar2.png"><img src="icons/avatar2.png" style="width:32px;height:32px;border-radius:50%;"></div>
                <div class="chip" data-avatar="icons/avatar3.png"><img src="icons/avatar3.png" style="width:32px;height:32px;border-radius:50%;"></div>
            </div>
            <button class="btn gold" id="saveProfileBtn">💾 Сохранить</button>
        </div>
    </div>
    
    <div class="modal" id="soloModal">
        <div class="modal-content">
            <button class="modal-close" id="soloCloseBtn">✕</button>
            <h3>🤖 Тренировка</h3>
            <div class="section-title">💰 Капитал</div>
            <div class="chip-row" id="sCashChips">
                <div class="chip" data-cash="1000">$1K</div>
                <div class="chip selected" data-cash="10000">$10K</div>
                <div class="chip" data-cash="50000">$50K</div>
            </div>
            <div class="section-title">📊 Раунды</div>
            <div class="chip-row" id="sRoundsChips">
                <div class="chip" data-rounds="5">5</div>
                <div class="chip selected" data-rounds="10">10</div>
                <div class="chip" data-rounds="15">15</div>
            </div>
            <div class="section-title">⏱ Сек/раунд</div>
            <div class="chip-row" id="sTimeChips">
                <div class="chip" data-time="15">15с</div>
                <div class="chip selected" data-time="30">30с</div>
                <div class="chip" data-time="45">45с</div>
            </div>
            <button class="btn gold" id="startSoloBtn">🚀 Начать</button>
        </div>
    </div>
    
    <div class="modal" id="adminModal">
        <div class="modal-content" style="border-color:#00e070;">
            <button class="modal-close" id="adminCloseBtn">✕</button>
            <h3 style="color:#00e070;">🛡️ АДМИН</h3>
            <div class="admin-row" id="adminCoinsBtn2" style="background:#0d0d1a;border:1px solid #2a2a3a;border-radius:8px;padding:10px;margin:4px 0;display:flex;justify-content:space-between;cursor:pointer;">
                <span>💰 Монеты</span><span class="val" style="color:#f0a030;">→</span>
            </div>
            <div class="admin-row" id="adminCheatsBtn2" style="background:#0d0d1a;border:1px solid #2a2a3a;border-radius:8px;padding:10px;margin:4px 0;display:flex;justify-content:space-between;cursor:pointer;">
                <span>🎮 Читы</span><span class="val" style="color:#f0a030;">→</span>
            </div>
        </div>
    </div>
    
    <!-- Модалка для читов (ВАЖНО: без неё была ошибка!) -->
    <div class="modal" id="adminCheatsModal">
        <div class="modal-content" style="border-color:#f0a030;">
            <button class="modal-close" id="adminCheatsCloseBtn">✕</button>
            <h3>🎮 Читы</h3>
            <div id="cheatsList"></div>
        </div>
    </div>
    
    <div class="modal" id="confirmModal">
        <div class="modal-content">
            <h3>Подтверждение</h3>
            <p id="confirmMsg"></p>
            <div style="display:flex;gap:10px;margin-top:10px;">
                <button class="btn green" id="confirmYes">✅ Да</button>
                <button class="btn red" id="confirmNo">✕ Нет</button>
            </div>
        </div>
    </div>
    
    <div class="modal" id="adminCoinsModal">
        <div class="modal-content">
            <button class="modal-close" id="adminCoinsCloseBtn">✕</button>
            <h3>💰 Монеты</h3>
            <input id="coinsTargetId" placeholder="ID игрока" class="input">
            <div class="coin-input-row" style="display:flex;gap:8px;margin-top:8px;">
                <input type="number" id="coinsAmount" placeholder="Сумма" value="100">
                <button class="btn green" id="coinsAddBtn" style="flex:1;">Добавить</button>
            </div>
        </div>
    </div>
</div>

<!-- ========== ПЛАВАЮЩИЕ КНОПКИ ========== -->
<button class="admin-btn" id="adminFloatBtn">🛡️</button>
<div id="copiedToast" class="copied-toast">✅ Скопировано!</div>

<script>
// ============================================================================
// ИНВЕСТ БАТТЛ v1.0 - ПОЛНОСТЬЮ РАБОЧАЯ ВЕРСИЯ
// ============================================================================
// ОСНОВНЫЕ ФУНКЦИИ:
// 1. Тренировка с ботом (соло-игра)
// 2. Покупка/продажа акций по раундам
// 3. Система монет и профиля
// 4. Админ-панель (выдача монет, читы)
// 5. Чит "Исход игры" - прогноз цен
// ============================================================================

// -------------------- 1. НАСТРОЙКА FIREBASE --------------------
const firebaseConfig = {
    databaseURL: "https://investbattle-45545-default-rtdb.firebaseio.com",
    projectId: "investbattle-45545"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ID администраторов (кто может открыть админ-панель)
const adminIDs = ['web_rfzuxppca', 'web_xg6jxslm7', 'tg_5909465804'];
let adminBtnVisible = false;  // Видимость кнопки админа

// -------------------- 2. ГЛОБАЛЬНОЕ СОСТОЯНИЕ --------------------
const s = {
    // Профиль
    pid: '',           // ID игрока (web_xxx или tg_xxx)
    pn: 'Трейдер',     // Никнейм
    pa: 'icons/avatar1.png',  // Аватар
    pd: 100,           // Монеты (Dollars)
    
    // Параметры текущей игры
    sc: 10000,         // Стартовый капитал
    rt: 30,            // Секунд на раунд
    tr: 10,            // Всего раундов
    cr: 0,             // Текущий раунд
    yc: 10000,         // Деньги игрока
    oc: 10000,         // Деньги оппонента (бота)
    yp: {},            // Портфель игрока {BTC: {qty:5, avgPrice:50000}}
    op: {},            // Портфель оппонента
    cc: null,          // Текущий кейс (акция)
    ga: false,         // Идёт ли игра
    fi: false,         // Финальная стадия
    mk: {},            // Текущие цены акций
    acl: [],           // Список всех кейсов из cases.json
    crdy: false,       // Загружены ли кейсы
    rtimer: null,      // Таймер раунда
    roundOk: false,    // Готовность к следующему раунду
    
    // Читы
    cheats: { predictOutcome: false },  // Прогноз цен
    
    // UI состояние
    currentTab: 'menu'
};

// -------------------- 3. ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ --------------------
// Получение ID игрока (из Telegram или localStorage)
function getPlayerId() {
    const tg = window.Telegram?.WebApp;
    if (tg?.initDataUnsafe?.user?.id) return 'tg_' + tg.initDataUnsafe.user.id;
    let id = localStorage.getItem('ib_pid');
    if (!id) { id = 'web_' + Math.random().toString(36).substr(2, 9); localStorage.setItem('ib_pid', id); }
    return id;
}

// Проверка, является ли игрок админом
function isAdmin() { return adminIDs.includes(s.pid); }

// Отображение аватара (HTML)
function renderAvatar(avatar) {
    if (avatar && avatar.startsWith('icons/')) 
        return `<img src="${avatar}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`;
    return avatar || '?';
}

// Форматирование чисел с $ знаком
function formatMoney(n) { return '$' + Math.round(n).toLocaleString('en-US'); }

// Всплывающее уведомление
function toast(msg) {
    const el = document.getElementById('copiedToast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 1500);
}

// Сохранение профиля в Firebase
function saveProfile() {
    if (!s.pid) return;
    db.ref('u/' + s.pid).set({ n: s.pn, a: s.pa, do: s.pd });
    db.ref('on/' + s.pid).set({ n: s.pn, ts: Date.now() });
    db.ref('on/' + s.pid).onDisconnect().remove();
    localStorage.setItem('ib_profile', JSON.stringify({ name: s.pn, avatar: s.pa, dollars: s.pd }));
}

// Загрузка профиля
function loadProfile(callback) {
    s.pid = getPlayerId();
    db.ref('u/' + s.pid).once('value', (snap) => {
        const data = snap.val();
        if (data) {
            s.pn = data.n || 'Трейдер';
            s.pa = data.a || 'icons/avatar1.png';
            s.pd = data.do || 100;
        } else {
            // Новый игрок: генерируем случайный ник
            s.pn = 'Трейдер' + Math.floor(Math.random() * 900 + 100);
            s.pa = 'icons/avatar' + (Math.floor(Math.random() * 3) + 1) + '.png';
            s.pd = 100;
            saveProfile();
        }
        // Восстанавливаем читы из localStorage
        const saved = localStorage.getItem('ib_cheats');
        if (saved) s.cheats = JSON.parse(saved);
        updateUI();
        if (callback) callback();
    });
}

// Обновление интерфейса (ник, монеты, аватар)
function updateUI() {
    document.getElementById('profileName').textContent = s.pn;
    document.getElementById('profileAvatar').innerHTML = renderAvatar(s.pa);
    document.getElementById('editAvatarBig').innerHTML = renderAvatar(s.previewAvatar || s.pa);
    document.getElementById('profileDollars').textContent = s.pd;
}

// -------------------- 4. ЗАГРУЗКА КЕЙСОВ (АКЦИЙ) --------------------
function loadCases() {
    fetch('cases.json')
        .then(res => res.json())
        .then(data => {
            s.acl = data.filter(c => c && c.symbol && c.price);
            s.crdy = true;
            document.getElementById('loadingScreen').style.display = 'none';
            document.getElementById('menuScreen').style.display = 'block';
        })
        .catch(err => {
            console.error('Ошибка загрузки кейсов:', err);
            s.crdy = true;
            document.getElementById('loadingScreen').style.display = 'none';
            document.getElementById('menuScreen').style.display = 'block';
        });
}

// -------------------- 5. ИГРОВАЯ ЛОГИКА --------------------
// Получение случайного кейса для текущего раунда
function getRandomCase() {
    const available = s.acl.filter(c => !s.uc?.includes(c.id));
    if (!available.length) { s.uc = []; return s.acl[Math.floor(Math.random() * s.acl.length)]; }
    return available[Math.floor(Math.random() * available.length)];
}

// Обновление цен акций (ход рынка)
function updateMarket() {
    for (let i = 0; i < s.acl.length; i++) {
        const c = s.acl[i];
        if (!c?.symbol) continue;
        if (!s.mk[c.symbol]) s.mk[c.symbol] = c.price;
        
        let current = s.mk[c.symbol];
        // Случайное изменение цены от -12% до +12%
        let change = (Math.random() - 0.5) * 24;
        // Иногда сильные скачки
        if (Math.random() < 0.05) change = (Math.random() > 0.5 ? 1 : -1) * (15 + Math.random() * 20);
        change = Math.max(-40, Math.min(40, change));
        s.mk[c.symbol] = Math.max(0.05, current * (1 + change / 100));
    }
    // Если включен чит прогноза - обновляем его
    if (s.cheats.predictOutcome && s.cc) updateGhostPredict();
}

// Обновление блока прогноза (чит "Исход игры")
function updateGhostPredict() {
    const box = document.getElementById('ghostPredictBox');
    if (!box || !s.cc) return;
    const price = s.mk[s.cc.symbol] || s.cc.price;
    const fair = s.cc.price;  // Справедливая цена = начальная
    let prediction = '';
    if (price > fair * 1.1) prediction = '⚠️ ПЕРЕОЦЕНЕНА (вероятна коррекция вниз)';
    else if (price < fair * 0.9) prediction = '💎 НЕДООЦЕНЕНА (вероятен рост)';
    else prediction = '⚖️ У справедливой цены';
    box.innerHTML = `🔮 <b>ПРОГНОЗ:</b> ${prediction}<br>💰 Текущая: ${formatMoney(price)} | ⚖️ Стартовая: ${formatMoney(fair)}`;
    box.style.display = 'block';
}

// Обновление таблицы портфеля
function updatePortfolio() {
    const tbody = document.getElementById('portfolioBody');
    const assets = Object.entries(s.yp);
    if (assets.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6">Нет активов</td></tr>';
        return;
    }
    tbody.innerHTML = assets.map(([sym, d]) => {
        const price = s.mk[sym] || d.avgPrice;
        const value = price * d.qty;
        const pct = d.avgPrice ? ((price - d.avgPrice) / d.avgPrice * 100) : 0;
        const cls = pct >= 0 ? 'up' : 'down';
        const sign = pct >= 0 ? '+' : '';
        return `<tr>
            <td class="sym">${sym}</td>
            <td>${d.qty}</td>
            <td>${formatMoney(price)}</td>
            <td>${formatMoney(value)}</td>
            <td class="${cls}">${sign}${Math.abs(pct).toFixed(1)}%</td>
            <td><input class="qty-input" id="sq_${sym}" value="${d.qty}"><button class="btn-sm sell" id="sl_${sym}">Продать</button></td>
        </tr>`;
    }).join('');
    
    // Привязываем обработчики кнопок "Продать"
    assets.forEach(([sym]) => {
        const btn = document.getElementById(`sl_${sym}`);
        if (btn) btn.onclick = () => {
            const d = s.yp[sym];
            if (!d) return;
            const inp = document.getElementById(`sq_${sym}`);
            let qty = Math.max(1, Math.min(d.qty, parseInt(inp?.value) || d.qty));
            s.yc += (s.mk[sym] || d.avgPrice) * qty;
            d.qty -= qty;
            if (d.qty <= 0) delete s.yp[sym];
            updatePortfolio();
            updatePlayersRow();
        };
    });
}

// Обновление строки с игроками (игрок vs бот)
function updatePlayersRow() {
    const playersHtml = `
        <div class="player-card you">
            <div class="avatar">${renderAvatar(s.pa)}</div>
            <div class="name">${s.pn} (Вы)</div>
            <div class="cash">${formatMoney(s.yc)}</div>
        </div>
        <div class="player-card">
            <div class="avatar">🤖</div>
            <div class="name">Бот-Трейдер</div>
            <div class="cash">${formatMoney(s.oc)}</div>
        </div>
    `;
    document.getElementById('playersRow').innerHTML = playersHtml;
}

// Покупка акции
function buyAction() {
    if (!s.ga || !s.cc) return;
    const price = s.mk[s.cc.symbol] || s.cc.price;
    const inp = document.getElementById('buyQty');
    let qty = Math.max(1, parseInt(inp.value) || 1);
    if (s.yc < price * qty) { toast('Не хватает денег!'); return; }
    
    s.yc -= price * qty;
    if (!s.yp[s.cc.symbol]) s.yp[s.cc.symbol] = { qty: 0, avgPrice: 0 };
    const o = s.yp[s.cc.symbol];
    o.avgPrice = (o.qty * o.avgPrice + price * qty) / (o.qty + qty);
    o.qty += qty;
    
    updatePortfolio();
    updatePlayersRow();
    updateBuyButton();
    playSound('buy');
}

// Продажа всех активов
function sellAll() {
    if (Object.keys(s.yp).length === 0) return;
    showConfirm('Продать ВСЕ активы?', (yes) => {
        if (!yes) return;
        for (let sym in s.yp) {
            s.yc += (s.mk[sym] || s.yp[sym].avgPrice) * s.yp[sym].qty;
        }
        s.yp = {};
        updatePortfolio();
        updatePlayersRow();
        playSound('sell');
    });
}

// Действия бота (покупка/продажа)
function botAction() {
    if (!s.cc) return;
    const sym = s.cc.symbol;
    const price = s.mk[sym] || s.cc.price;
    
    // Бот покупает с вероятностью 60%, если есть деньги
    if (Math.random() < 0.6 && s.oc >= price * 2) {
        const maxQty = Math.floor(s.oc / price);
        let qty = Math.floor(Math.random() * 5) + 1;
        if (qty > maxQty) qty = maxQty;
        if (qty > 0) {
            s.oc -= price * qty;
            if (!s.op[sym]) s.op[sym] = { qty: 0, avgPrice: 0 };
            const o = s.op[sym];
            o.avgPrice = (o.qty * o.avgPrice + price * qty) / (o.qty + qty);
            o.qty += qty;
        }
    }
    // Бот продает, если цена выросла на 20%
    else if (s.op[sym] && s.op[sym].qty > 0 && price > s.op[sym].avgPrice * 1.2) {
        let qty = Math.min(s.op[sym].qty, Math.ceil(s.op[sym].qty * 0.5));
        if (qty > 0) {
            s.oc += price * qty;
            s.op[sym].qty -= qty;
            if (s.op[sym].qty <= 0) delete s.op[sym];
        }
    }
    updatePlayersRow();
}

// Бот продаёт всё в конце игры
function botSellAll() {
    for (let sym in s.op) {
        s.oc += (s.mk[sym] || s.op[sym].avgPrice) * s.op[sym].qty;
    }
    s.op = {};
}

// Переход к следующему раунду
function nextRound() {
    if (s.cr >= s.tr) { startFinal(); return; }
    s.cr++;
    updateMarket();
    document.getElementById('roundBadge').textContent = `${s.cr}/${s.tr}`;
    
    const k = getRandomCase();
    if (!k) { nextRound(); return; }
    s.cc = k;
    if (!s.mk[k.symbol]) s.mk[k.symbol] = k.price;
    
    document.getElementById('caseTitle').textContent = `${k.symbol} - ${k.name || ''}`;
    document.getElementById('caseDesc').textContent = k.desc || '';
    document.getElementById('casePrice').textContent = formatMoney(s.mk[k.symbol]);
    
    updatePortfolio();
    updatePlayersRow();
    updateBuyButton();
    if (s.cheats.predictOutcome) updateGhostPredict();
    
    botAction();
    startRoundTimer();
}

// Запуск таймера раунда
function startRoundTimer() {
    let t = s.rt;
    const timerEl = document.getElementById('timer');
    timerEl.textContent = t;
    timerEl.classList.remove('urgent');
    clearInterval(s.rtimer);
    s.rtimer = setInterval(() => {
        t--;
        timerEl.textContent = t;
        if (t <= 5) timerEl.classList.add('urgent');
        if (t <= 0) {
            clearInterval(s.rtimer);
            nextRound();
        }
    }, 1000);
}

// Финальная стадия (подсчёт результатов)
function startFinal() {
    s.fi = true;
    clearInterval(s.rtimer);
    document.getElementById('gameScreen').style.display = 'none';
    document.getElementById('finalOverlay')?.classList.add('show');
    
    // Простой расчёт победителя
    const myTotal = s.yc + Object.values(s.yp).reduce((sum, d) => sum + (s.mk[Object.keys(s.yp).find(k => s.yp[k] === d)] || d.avgPrice) * d.qty, 0);
    const botTotal = s.oc + Object.values(s.op).reduce((sum, d) => sum + (s.mk[Object.keys(s.op).find(k => s.op[k] === d)] || d.avgPrice) * d.qty, 0);
    const win = myTotal > botTotal;
    
    if (win) {
        s.pd += 100;
        toast(`Победа! +100 монет`);
    } else {
        s.pd = Math.max(0, s.pd - 100);
        toast(`Поражение... -100 монет`);
    }
    saveProfile();
    updateUI();
    
    // Показываем результат
    alert(`${win ? '🏆 ПОБЕДА!' : '💔 ПОРАЖЕНИЕ'}\nВаш капитал: ${formatMoney(myTotal)}\nБот: ${formatMoney(botTotal)}`);
    leaveGame();
}

// Начало игры
function startGame() {
    if (!s.crdy) { alert('Загрузка...'); return; }
    s.yc = s.sc;
    s.oc = s.sc;
    s.yp = {};
    s.op = {};
    s.mk = {};
    s.cr = 0;
    s.ga = true;
    s.fi = false;
    s.uc = [];
    
    document.getElementById('menuScreen').style.display = 'none';
    document.getElementById('gameScreen').style.display = 'block';
    document.getElementById('roundBadge').textContent = `0/${s.tr}`;
    
    updatePortfolio();
    updatePlayersRow();
    nextRound();
}

// Выход из игры
function leaveGame() {
    s.ga = false;
    clearInterval(s.rtimer);
    document.getElementById('gameScreen').style.display = 'none';
    document.getElementById('menuScreen').style.display = 'block';
    document.getElementById('playMenu').style.display = 'block';
    document.getElementById('playMenuBtn').style.display = 'none';
    document.getElementById('ghostPredictBox').style.display = 'none';
}

// Обновление кнопки "Купить" (достаточно ли денег)
function updateBuyButton() {
    if (!s.cc) return;
    const price = s.mk[s.cc.symbol] || s.cc.price;
    const qty = parseInt(document.getElementById('buyQty').value) || 1;
    document.getElementById('buyBtn').disabled = s.yc < price * qty;
}

// Установка количества для покупки (вызывается из кнопок)
window.setBuyQty = function(v) {
    const inp = document.getElementById('buyQty');
    if (v === 'max') {
        const price = s.cc ? (s.mk[s.cc.symbol] || s.cc.price) : 1;
        inp.value = Math.floor(s.yc / price) || 1;
    } else {
        inp.value = v;
    }
    updateBuyButton();
};

// Подтверждение действия
function showConfirm(msg, callback) {
    document.getElementById('confirmMsg').textContent = msg;
    document.getElementById('confirmModal').classList.add('show');
    document.getElementById('confirmYes').onclick = () => {
        document.getElementById('confirmModal').classList.remove('show');
        callback(true);
    };
    document.getElementById('confirmNo').onclick = () => {
        document.getElementById('confirmModal').classList.remove('show');
        callback(false);
    };
}

// Звуки (заглушка, т.к. файлов может не быть)
function playSound(type) { /* можно добавить реальные звуки */ }

// -------------------- 6. АДМИН-ПАНЕЛЬ --------------------
function showAdminCoins() {
    document.getElementById('adminCoinsModal').classList.add('show');
}
function addCoinsToPlayer() {
    const targetId = document.getElementById('coinsTargetId').value.trim();
    const amount = parseInt(document.getElementById('coinsAmount').value);
    if (!targetId || !amount) { toast('Введите ID и сумму'); return; }
    db.ref('u/' + targetId + '/do').transaction(cur => (cur || 0) + amount);
    toast(`+${amount} монет игроку ${targetId}`);
    document.getElementById('adminCoinsModal').classList.remove('show');
}

// Чит "Исход игры"
function showAdminCheats() {
    const modal = document.getElementById('adminCheatsModal');
    const list = document.getElementById('cheatsList');
    list.innerHTML = `
        <div class="cheat-toggle" style="display:flex;justify-content:space-between;padding:10px;background:#0d0d1a;border-radius:8px;margin:4px 0;cursor:pointer;">
            <span>🔮 Исход игры (прогноз цен)</span>
            <div class="switch" style="width:44px;height:24px;background:#333;border-radius:12px;position:relative;transition:all 0.3s;${s.cheats.predictOutcome ? 'background:#00e070;' : ''}">
                <div style="position:absolute;top:2px;left:${s.cheats.predictOutcome ? '22px' : '2px'};width:20px;height:20px;background:#fff;border-radius:50%;transition:all 0.3s;"></div>
            </div>
        </div>
    `;
    modal.classList.add('show');
    
    const toggle = list.querySelector('.cheat-toggle');
    toggle.onclick = () => {
        s.cheats.predictOutcome = !s.cheats.predictOutcome;
        localStorage.setItem('ib_cheats', JSON.stringify(s.cheats));
        const switchDiv = toggle.querySelector('.switch');
        const dot = switchDiv.querySelector('div');
        if (s.cheats.predictOutcome) {
            switchDiv.style.background = '#00e070';
            dot.style.left = '22px';
            toast('Чит ВКЛЮЧЁН! В игре появится прогноз');
            if (s.ga && s.cc) updateGhostPredict();
        } else {
            switchDiv.style.background = '#333';
            dot.style.left = '2px';
            document.getElementById('ghostPredictBox').style.display = 'none';
            toast('Чит ВЫКЛЮЧЕН');
        }
    };
}

// -------------------- 7. ОБРАБОТЧИКИ СОБЫТИЙ --------------------
function bindEvents() {
    // Навигация по меню
    document.getElementById('playMenuBtn').onclick = () => {
        document.getElementById('playMenu').style.display = 'block';
        document.getElementById('playMenuBtn').style.display = 'none';
    };
    document.getElementById('backMenuBtn').onclick = () => {
        document.getElementById('playMenu').style.display = 'none';
        document.getElementById('playMenuBtn').style.display = 'block';
    };
    
    // Соло-игра
    document.getElementById('soloBtn').onclick = () => document.getElementById('soloModal').classList.add('show');
    document.getElementById('soloCloseBtn').onclick = () => document.getElementById('soloModal').classList.remove('show');
    document.getElementById('startSoloBtn').onclick = () => {
        s.sc = parseInt(document.querySelector('#sCashChips .selected')?.dataset.cash || 10000);
        s.tr = parseInt(document.querySelector('#sRoundsChips .selected')?.dataset.rounds || 10);
        s.rt = parseInt(document.querySelector('#sTimeChips .selected')?.dataset.time || 30);
        document.getElementById('soloModal').classList.remove('show');
        startGame();
    };
    
    // Игровые кнопки
    document.getElementById('buyBtn').onclick = buyAction;
    document.getElementById('waitBtn').onclick = () => nextRound();
    document.getElementById('sellAllBtn').onclick = sellAll;
    document.getElementById('qtyMinus').onclick = () => {
        const inp = document.getElementById('buyQty');
        inp.value = Math.max(1, (parseInt(inp.value) || 1) - 1);
        updateBuyButton();
    };
    document.getElementById('qtyPlus').onclick = () => {
        const inp = document.getElementById('buyQty');
        inp.value = Math.min(999, (parseInt(inp.value) || 1) + 1);
        updateBuyButton();
    };
    document.getElementById('buyQty').oninput = function() {
        this.value = this.value.replace(/[^0-9]/g, '') || '1';
        updateBuyButton();
    };
    
    // Выход в меню
    document.getElementById('menuBtn')?.addEventListener('click', leaveGame);
    
    // Профиль
    document.getElementById('profileAvatar').onclick = () => {
        s.previewAvatar = s.pa;
        updateUI();
        document.getElementById('profileModal').classList.add('show');
    };
    document.getElementById('profileCloseBtn').onclick = () => document.getElementById('profileModal').classList.remove('show');
    document.getElementById('saveProfileBtn').onclick = () => {
        const newName = document.getElementById('editName').value.trim() || 'Трейдер';
        s.pn = newName;
        s.pa = s.previewAvatar || s.pa;
        s.previewAvatar = null;
        saveProfile();
        updateUI();
        document.getElementById('profileModal').classList.remove('show');
        toast('Профиль сохранён!');
    };
    
    // Выбор аватара
    document.querySelectorAll('#avatarChips .chip').forEach(chip => {
        chip.onclick = () => {
            document.querySelectorAll('#avatarChips .chip').forEach(c => c.classList.remove('selected'));
            chip.classList.add('selected');
            s.previewAvatar = chip.dataset.avatar;
            document.getElementById('editAvatarBig').innerHTML = renderAvatar(s.previewAvatar);
        };
    });
    
    // Выбор параметров игры (капитал, раунды, время)
    document.querySelectorAll('#sCashChips .chip, #sRoundsChips .chip, #sTimeChips .chip').forEach(chip => {
        chip.onclick = function() {
            this.parentElement.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
            this.classList.add('selected');
        };
    });
    
    // Админ-панель
    document.getElementById('adminCoinsBtn2').onclick = showAdminCoins;
    document.getElementById('adminCheatsBtn2').onclick = showAdminCheats;
    document.getElementById('adminCoinsCloseBtn').onclick = () => document.getElementById('adminCoinsModal').classList.remove('show');
    document.getElementById('adminCheatsCloseBtn').onclick = () => document.getElementById('adminCheatsModal').classList.remove('show');
    document.getElementById('adminCloseBtn').onclick = () => document.getElementById('adminModal').classList.remove('show');
    document.getElementById('coinsAddBtn').onclick = addCoinsToPlayer;
    
    // Кнопка админа (появляется после 3 кликов по логотипу)
    document.getElementById('adminFloatBtn').onclick = () => {
        if (isAdmin() && adminBtnVisible) document.getElementById('adminModal').classList.add('show');
    };
    
    // Клик по логотипу для показа админ-кнопки
    let logoClickCount = 0, logoClickTimer;
    document.getElementById('logoClick').onclick = () => {
        if (!isAdmin()) return;
        logoClickCount++;
        clearTimeout(logoClickTimer);
        if (logoClickCount >= 3) {
            adminBtnVisible = !adminBtnVisible;
            document.getElementById('adminFloatBtn').style.display = adminBtnVisible ? 'flex' : 'none';
            toast(adminBtnVisible ? 'Админ-панель доступна' : 'Админ-панель скрыта');
            logoClickCount = 0;
        }
        logoClickTimer = setTimeout(() => { logoClickCount = 0; }, 2000);
    };
}

// -------------------- 8. ЗАПУСК --------------------
loadProfile(() => {
    loadCases();
    bindEvents();
});
</script>
